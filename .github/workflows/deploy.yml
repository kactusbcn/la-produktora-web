name: Desplegar web en IONOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar carpeta de publicación
        run: |
          mkdir -p _site
          shopt -s dotglob
          for f in *; do
            case "$f" in _site|.github) continue ;; esac
            cp -r "$f" _site/
          done
          echo "Ficheros a publicar:"
          find _site -type f | sort

      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Subir a IONOS por SFTP
        env:
          HOST: ${{ secrets.FTP_SERVER }}
          USER_NAME: ${{ secrets.FTP_USERNAME }}
          PASS: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          lftp -u "$USER_NAME","$PASS" \
            -e "set sftp:auto-confirm yes; set net:max-retries 2; mirror -R --verbose --parallel=4 _site/ '$REMOTE_DIR'; bye" \
            "sftp://$HOST"
